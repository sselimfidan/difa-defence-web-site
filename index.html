<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Difa Defence</title>
  <meta name="description" content="Difa Defence — unmanned systems, electronic warfare, armament and integrated defence solutions delivered worldwide.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="shell">
      <div id="brand"></div>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span></button>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero" id="home">
      <div class="hero__media" id="hero-media"></div>
      <div class="shell">
        <div class="hero__inner" id="hero-inner"></div>
      </div>
      <div class="scroll-cue">Scroll <span></span></div>
    </section>

    <!-- About -->
    <section class="section" id="about">
      <div class="shell about__grid">
        <div class="about__copy reveal" id="about-copy"></div>
        <div class="about__media reveal" id="about-media"></div>
      </div>
    </section>

    <!-- Activities -->
    <section class="section section--tint" id="activities">
      <div class="shell act__grid">
        <div class="act__media reveal" id="act-media"></div>
        <div class="act__copy reveal" id="act-copy"></div>
      </div>
    </section>

    <!-- Products -->
    <section class="section" id="products">
      <div class="shell">
        <div class="products__head reveal" id="products-head"></div>
        <div class="cards reveal" id="products-cards"></div>
      </div>
    </section>

    <!-- Contact -->
    <section class="contact" id="contact">
      <div class="shell">
        <div class="contact__grid">
          <div class="reveal" id="contact-copy"></div>
        </div>
        <div class="reveal" id="contact-map"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell" id="footer"></div>
  </footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
